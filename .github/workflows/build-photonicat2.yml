name: build photonicat2

# Verification build of photonicatWrt 26.04.1 for ariaboard_photonicat2.
#
# The point of this workflow is to reproduce the vendor firmware from source
# on a machine that is not the vendor's, so that packages missing from their
# feeds -- amneziawg in particular -- can be built against the exact kernel
# the device runs (6.12.91, see include/kernel-6.12).
#
# Run it from the Actions tab: "Run workflow".

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: which file under configs/ to build
        default: photonicat2_base_defconfig
        type: string
      scope:
        description: >-
          awg = toolchain, kernel and the AmneziaWG packages only (~2h30m).
          full = the whole 1776-package world and an image, which does not
          reliably fit a 4-core runner inside the 6h ceiling.
        default: awg
        type: choice
        options: [awg, full]
      skip_node:
        description: >-
          drop the 12 node packages (all =m, absent from the image) -- they
          cost over 2.5h of host V8 compilation
        default: true
        type: boolean
      verbose:
        description: build single-threaded with V=s (slow, readable logs)
        default: false
        type: boolean

env:
  # The runner's / has ~14 GB free, nowhere near enough. /mnt is the Azure
  # temp disk and carries ~65 GB, so the tree lives there and the workspace
  # keeps only the checkout.
  BUILD_DIR: /mnt/build/openwrt

jobs:
  build:
    runs-on: ubuntu-latest
    # The hard ceiling is 360; stopping short of it means the log-collection
    # and artifact steps still run instead of being killed with the job.
    timeout-minutes: 345

    steps:
      - name: Report disk space
        # Run 37610731481 settled this: the runner has 145 GB with 86 GB free
        # before any cleanup, and the whole build used 29 GB. The usual
        # incantation that deletes /usr/share/dotnet and friends is pure
        # superstition here -- it cost 100 seconds and freed space nothing
        # needed. Left as a report so a future change in runner sizing is
        # visible rather than mysterious.
        run: df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The repo README targets Ubuntu 20.04 and asks for lib32gcc1 and
          # python2.7, neither of which exists on 24.04. This is OpenWrt's
          # own current prerequisite list instead.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget time ccache

      - name: Prepare the build area on /mnt
        run: |
          sudo mkdir -p /mnt/build
          sudo chown "$USER":"$USER" /mnt/build

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          path: checkout

      - name: Move the tree onto /mnt
        run: |
          mv "$GITHUB_WORKSPACE/checkout" "$BUILD_DIR"
          cd "$BUILD_DIR"
          git log --oneline -1
          echo "kernel this tree builds:"
          grep '^LINUX_VERSION-6.12' include/kernel-6.12

      - name: Update and install feeds
        working-directory: /mnt/build/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply the defconfig
        working-directory: /mnt/build/openwrt
        run: |
          cfg="configs/${{ inputs.defconfig }}"
          test -f "$cfg" || { echo "no such config: $cfg"; ls configs/; exit 1; }
          cp "$cfg" .config

          if [ "${{ inputs.skip_node }}" != "false" ]; then
            # Node.js is the single most expensive thing in this tree. In run
            # 37610731481 it unpacked at 14:12:58 and was still compiling V8
            # when the job was cancelled at 16:42 -- 2h29m, against 3h13m for
            # everything else put together, and it had not finished.
            #
            # All 12 node packages are '=m': built as .ipk, not installed in
            # the image. Dropping them therefore cannot change the firmware,
            # only which extra .ipk files land in bin/packages. The assertion
            # below is what makes that claim checkable rather than a promise.
            sed -i -E 's/^(CONFIG_PACKAGE_node(-[^=]*)?)=[ym]$/# \1 is not set/' .config
            echo "node packages disabled: $(grep -cE '^# CONFIG_PACKAGE_node(-| )' .config)"
          fi

          if [ "${{ inputs.scope }}" = "awg" ]; then
            # The three AmneziaWG packages, as modules: they are installed on
            # the running device with opkg, not baked into an image.
            for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
              sed -i -E "/^(# )?CONFIG_PACKAGE_$p( is not set|=.*)\$/d" .config
              echo "CONFIG_PACKAGE_$p=m" >> .config
            done
          fi

          make defconfig
          echo "::group::resolved target"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=' .config
          grep -E '^CONFIG_VERSION_(DIST|NUMBER)=' .config
          echo "::endgroup::"
          # defconfig silently drops symbols whose dependencies are missing,
          # which is how a build ends up quietly not containing what was asked
          # for. Run 37610731481 had 1776 -> 1776, so the vendor config is
          # fully satisfiable; a gap here means something has since broken.
          before=$(grep -c '^CONFIG_PACKAGE_.*=[ym]' "$cfg")
          after=$(grep -c '^CONFIG_PACKAGE_.*=[ym]' .config)
          echo "packages selected: $before in configs/, $after after defconfig"

          # The image is exactly the '=y' set. Asserting it is unchanged is
          # what proves skip_node cost nothing: if dropping node ever removes
          # something from the firmware, this fails instead of shipping a
          # quietly different image.
          want=$(grep -c '^CONFIG_PACKAGE_.*=y' "$cfg")
          got=$(grep -c '^CONFIG_PACKAGE_.*=y' .config)
          echo "in-image packages: $want in configs/, $got after defconfig"
          if [ "$want" != "$got" ]; then
            echo "::error::in-image package count changed ($want -> $got); the image would differ"
            diff <(grep '^CONFIG_PACKAGE_.*=y' "$cfg" | sort) \
                 <(grep '^CONFIG_PACKAGE_.*=y' .config | sort) || true
            exit 1
          fi

          if [ "${{ inputs.scope }}" = "awg" ]; then
            # defconfig drops a symbol whose package the feeds never installed,
            # and does it silently. Without this check the build would run for
            # two hours and then produce no amneziawg at all, which looks like
            # a packaging mystery rather than a missing feed.
            missing=
            for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
              grep -q "^CONFIG_PACKAGE_$p=m\$" .config || missing="$missing $p"
            done
            if [ -n "$missing" ]; then
              echo "::error::defconfig dropped:$missing -- the awg feed did not install"
              exit 1
            fi
            echo "amneziawg packages selected: kmod, tools, luci-proto"
          fi

      - name: Download sources
        working-directory: /mnt/build/openwrt
        run: |
          for attempt in 1 2 3; do
            if make download -j8; then break; fi
            echo "download attempt $attempt failed, retrying"
            # Truncated tarballs are the classic cause of a build that fails
            # an hour later for no visible reason. Clear them before retrying
            # rather than after, so the retry actually refetches them.
            find dl -type f -size -1024c -print -delete || true
            sleep 20
          done

      - name: Build
        working-directory: /mnt/build/openwrt
        run: |
          j=$(nproc)
          V=
          if [ "${{ inputs.verbose }}" = "true" ]; then j=1; V=V=s; fi

          if [ "${{ inputs.scope }}" = "full" ]; then
            if make -j"$j" $V; then
              exit 0
            fi
            echo "::warning::parallel build failed, retrying single-threaded for a readable error"
            exec make -j1 V=s
          fi

          # Staged rather than one 'make package/.../compile' so that a failure
          # is attributable. Run 37610731481 measured these: tools 1h22m,
          # toolchain 23m, kernel 28m. The packages themselves are minutes.
          echo "::group::tools and toolchain"
          make -j"$j" tools/install toolchain/install
          echo "::endgroup::"

          echo "::group::kernel"
          # kmod-amneziawg links against this exact kernel; its vermagic is
          # what decides whether the module loads on the stock vendor image.
          make -j"$j" target/compile
          echo "::endgroup::"

          echo "::group::amneziawg"
          make -j"$j" \
            package/kmod-amneziawg/compile \
            package/amneziawg-tools/compile \
            package/luci-proto-amneziawg/compile
          make -j"$j" package/index
          echo "::endgroup::"

          echo "::group::vermagic of the built module"
          # The whole point of building in-tree. This must match what
          # 'modinfo wireguard.ko' reports on the device: 6.12.91 SMP preempt
          # mod_unload aarch64.
          find build_dir -name 'amneziawg.ko' -exec sh -c \
            'echo "$1"; strings "$1" | grep -m1 ^vermagic=' _ {} \;
          echo "::endgroup::"

      - name: Summarise output
        if: always()
        working-directory: /mnt/build/openwrt
        run: |
          echo "::group::disk"
          df -h / /mnt
          echo "::endgroup::"
          echo "::group::images"
          ls -la bin/targets/rockchip/armv8/ 2>/dev/null || echo "(no images)"
          echo "::endgroup::"
          echo "::group::package counts"
          find bin/packages -name '*.ipk' -o -name '*.apk' 2>/dev/null | wc -l
          echo "::endgroup::"

      - name: Upload target output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Not just images: kernel modules land in bin/targets/<t>/<s>/packages/,
          # so in 'awg' scope this is the artifact holding kmod-amneziawg, and
          # there is no image in it at all.
          name: targets
          path: /mnt/build/openwrt/bin/targets/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: /mnt/build/openwrt/bin/packages/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the config actually used
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: /mnt/build/openwrt/.config
          if-no-files-found: warn
          retention-days: 14
