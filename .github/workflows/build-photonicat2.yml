name: build photonicat2

# Verification build of photonicatWrt 26.04.1 for ariaboard_photonicat2.
#
# The point of this workflow is to reproduce the vendor firmware from source
# on a machine that is not the vendor's, so that packages missing from their
# feeds -- amneziawg in particular -- can be built against the exact kernel
# the device runs (6.12.91, see include/kernel-6.12).
#
# Run it from the Actions tab: "Run workflow".

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: which file under configs/ to build
        default: photonicat2_base_defconfig
        type: string
      verbose:
        description: build single-threaded with V=s (slow, readable logs)
        default: false
        type: boolean

env:
  # The runner's / has ~14 GB free, nowhere near enough. /mnt is the Azure
  # temp disk and carries ~65 GB, so the tree lives there and the workspace
  # keeps only the checkout.
  BUILD_DIR: /mnt/build/openwrt

jobs:
  build:
    runs-on: ubuntu-latest
    # The hard ceiling is 360; stopping short of it means the log-collection
    # and artifact steps still run instead of being killed with the job.
    timeout-minutes: 345

    steps:
      - name: Reclaim disk space
        run: |
          echo "::group::before"
          df -h / /mnt
          echo "::endgroup::"
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean
          echo "::group::after"
          df -h / /mnt
          echo "::endgroup::"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The repo README targets Ubuntu 20.04 and asks for lib32gcc1 and
          # python2.7, neither of which exists on 24.04. This is OpenWrt's
          # own current prerequisite list instead.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget time ccache

      - name: Prepare the build area on /mnt
        run: |
          sudo mkdir -p /mnt/build
          sudo chown "$USER":"$USER" /mnt/build

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          path: checkout

      - name: Move the tree onto /mnt
        run: |
          mv "$GITHUB_WORKSPACE/checkout" "$BUILD_DIR"
          cd "$BUILD_DIR"
          git log --oneline -1
          echo "kernel this tree builds:"
          grep '^LINUX_VERSION-6.12' include/kernel-6.12

      - name: Update and install feeds
        working-directory: /mnt/build/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply the defconfig
        working-directory: /mnt/build/openwrt
        run: |
          cfg="configs/${{ inputs.defconfig }}"
          test -f "$cfg" || { echo "no such config: $cfg"; ls configs/; exit 1; }
          cp "$cfg" .config
          make defconfig
          echo "::group::resolved target"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=' .config
          grep -E '^CONFIG_VERSION_(DIST|NUMBER)=' .config
          echo "::endgroup::"
          # defconfig silently drops symbols whose dependencies are missing,
          # which is how a build ends up quietly not containing what was asked
          # for. Print both counts so a large gap is visible in the log.
          before=$(grep -c '^CONFIG_PACKAGE_.*=[ym]' "$cfg")
          after=$(grep -c '^CONFIG_PACKAGE_.*=[ym]' .config)
          echo "packages selected: $before in configs/, $after after defconfig"

      - name: Download sources
        working-directory: /mnt/build/openwrt
        run: |
          for attempt in 1 2 3; do
            if make download -j8; then break; fi
            echo "download attempt $attempt failed, retrying"
            # Truncated tarballs are the classic cause of a build that fails
            # an hour later for no visible reason. Clear them before retrying
            # rather than after, so the retry actually refetches them.
            find dl -type f -size -1024c -print -delete || true
            sleep 20
          done

      - name: Build
        working-directory: /mnt/build/openwrt
        run: |
          if [ "${{ inputs.verbose }}" = "true" ]; then
            make -j1 V=s
          else
            make -j"$(nproc)" || {
              echo "::warning::parallel build failed, retrying single-threaded for a readable error"
              make -j1 V=s
            }
          fi

      - name: Summarise output
        if: always()
        working-directory: /mnt/build/openwrt
        run: |
          echo "::group::disk"
          df -h / /mnt
          echo "::endgroup::"
          echo "::group::images"
          ls -la bin/targets/rockchip/armv8/ 2>/dev/null || echo "(no images)"
          echo "::endgroup::"
          echo "::group::package counts"
          find bin/packages -name '*.ipk' -o -name '*.apk' 2>/dev/null | wc -l
          echo "::endgroup::"

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: /mnt/build/openwrt/bin/targets/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: /mnt/build/openwrt/bin/packages/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the config actually used
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: /mnt/build/openwrt/.config
          if-no-files-found: warn
          retention-days: 14
